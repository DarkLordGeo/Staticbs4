server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router client-side routes (e.g. /search) aren't real files —
    # fall back to index.html and let the app's own router handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
