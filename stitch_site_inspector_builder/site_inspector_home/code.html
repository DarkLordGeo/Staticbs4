<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Site Inspector - Visual Web Scraper</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed": "#ffdad7",
                        "surface-container-low": "#f0f4fc",
                        "on-error": "#ffffff",
                        "surface": "#f8f9ff",
                        "on-tertiary-fixed": "#410004",
                        "outline-variant": "#bdcabc",
                        "on-primary-fixed": "#00210d",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#e1e2e8",
                        "inverse-primary": "#65dd90",
                        "secondary-fixed": "#e1e2e8",
                        "primary-fixed-dim": "#65dd90",
                        "primary-fixed": "#82faaa",
                        "surface-bright": "#f8f9ff",
                        "tertiary-fixed-dim": "#ffb3ad",
                        "secondary": "#5c5e63",
                        "tertiary-container": "#da3437",
                        "surface-tint": "#006d3a",
                        "on-secondary-container": "#626469",
                        "on-primary-fixed-variant": "#00522a",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#44474b",
                        "inverse-on-surface": "#edf1f9",
                        "background": "#f8f9ff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#191c20",
                        "on-primary": "#ffffff",
                        "surface-dim": "#d6dae3",
                        "surface-container-highest": "#dfe2eb",
                        "surface-container": "#eaeef6",
                        "error": "#ba1a1a",
                        "outline": "#6e7a6e",
                        "secondary-fixed-dim": "#c5c6cc",
                        "on-tertiary-fixed-variant": "#930013",
                        "tertiary": "#b61722",
                        "on-primary-container": "#f6fff4",
                        "inverse-surface": "#2c3137",
                        "primary": "#006a38",
                        "on-surface-variant": "#3e4a3f",
                        "on-tertiary-container": "#fffbff",
                        "primary-container": "#008648",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e5e8f1",
                        "on-surface": "#171c22",
                        "on-error-container": "#93000a",
                        "surface-variant": "#dfe2eb",
                        "on-background": "#171c22"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "unit": "4px",
                        "panel-padding": "16px",
                        "component-gap": "8px",
                        "gutter": "12px"
                    },
                    fontFamily: {
                        "display-lg": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "body-sm": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "terminal-code": ["JetBrains Mono"]
                    },
                    fontSize: {
                        "display-lg": ["32px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "label-caps": ["11px", { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "700" }],
                        "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "500" }],
                        "headline-md": ["20px", { lineHeight: "1.4", fontWeight: "700" }],
                        "terminal-code": ["13px", { lineHeight: "1.6", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .metal-texture {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }
        
        .beveled-chassis {
            box-shadow: inset 1px 1px 0px rgba(255,255,255,0.8), 
                        inset -1px -1px 0px rgba(122,126,133,0.5),
                        0px 10px 25px -5px rgba(0,0,0,0.1),
                        0px 8px 10px -6px rgba(0,0,0,0.1);
        }
        
        .recessed-well {
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.15), 
                        inset -1px -1px 2px rgba(255,255,255,0.7);
        }
        
        .glossy-btn {
            background: linear-gradient(180deg, #008648 0%, #006a38 100%);
            box-shadow: inset 0px 1px 1px rgba(255,255,255,0.4),
                        0px 4px 6px -1px rgba(0,0,0,0.2),
                        0px 2px 4px -1px rgba(0,0,0,0.1);
            transition: all 0.1s ease;
        }
        
        .glossy-btn:hover {
            background: linear-gradient(180deg, #009e54 0%, #007c41 100%);
            box-shadow: inset 0px 1px 1px rgba(255,255,255,0.5),
                        0px 5px 8px -1px rgba(0,0,0,0.25),
                        0px 3px 6px -1px rgba(0,0,0,0.15);
        }
        
        .glossy-btn:active {
            background: linear-gradient(180deg, #005a30 0%, #006a38 100%);
            box-shadow: inset 0px 3px 5px rgba(0,0,0,0.3);
            transform: translateY(2px);
        }

        .led-on {
            box-shadow: 0 0 8px 1px #4ade80, inset 0 0 2px rgba(255,255,255,0.8);
            background-color: #4ade80;
        }
        
        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.05));
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 md:p-8 overflow-hidden metal-texture font-body-sm text-on-surface">
<!-- Hero Console Layout -->
<main class="w-full max-w-5xl beveled-chassis bg-surface-container rounded-xl overflow-hidden flex flex-col border border-outline-variant relative z-10">
<!-- Header -->
<header class="bg-surface-dim border-b border-outline-variant h-12 flex justify-between items-center w-full px-panel-padding shadow-[inset_0px_1px_0px_rgba(255,255,255,0.4)] relative z-20">
<div class="flex items-center gap-4">
<h1 class="font-display-lg text-headline-md tracking-tighter text-on-surface uppercase">SITE INSPECTOR</h1>
<div class="flex items-center gap-2 bg-surface-container-highest px-3 py-1 rounded-full border border-outline shadow-[inset_1px_1px_2px_rgba(0,0,0,0.1)]">
<div class="w-2 h-2 rounded-full led-on"></div>
<span class="font-terminal-code text-label-caps text-on-surface-variant">READY</span>
</div>
</div>
<div class="flex items-center gap-2 text-on-surface-variant">
<button class="hover:bg-surface-container-high transition-colors p-1 rounded">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
</button>
</div>
</header>
<!-- Main Content Area (Bento-ish Grid inside the panel) -->
<div class="flex-grow p-panel-padding md:p-8 flex flex-col md:flex-row gap-8 items-center justify-between">
<!-- Left: Copy & CTA -->
<div class="flex-1 flex flex-col gap-6 max-w-lg">
<div class="space-y-4">
<h2 class="font-display-lg text-[40px] md:text-[56px] leading-[1.1] text-on-surface font-extrabold tracking-tight">
                        BUILD SCRAPERS BY CLICKING
                    </h2>
<p class="font-body-sm text-headline-md text-on-surface-variant font-medium">
                        Visually extract structured data from static websites with BeautifulSoup-style functions.
                    </p>
</div>
<div class="pt-4">
<a class="inline-flex items-center justify-center gap-3 glossy-btn rounded border border-primary-fixed-dim/30 px-8 py-4 font-terminal-code text-terminal-code text-on-primary font-bold tracking-wider uppercase w-full md:w-auto text-center cursor-pointer" href="/search">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
                        LAUNCH INSPECTOR
                    </a>
</div>
</div>
<!-- Right: Mini Visual Representation -->
<div class="flex-1 w-full max-w-md">
<div class="recessed-well bg-surface-container-highest rounded-lg p-3 border border-outline-variant flex flex-col gap-3">
<!-- Mini Terminal/URL Bar -->
<div class="bg-[#1a1c1e] rounded shadow-inner border border-[#2c3137] p-2 flex items-center gap-2 scanlines relative overflow-hidden">
<span class="material-symbols-outlined text-primary-fixed-dim text-[16px]">terminal</span>
<code class="font-terminal-code text-[11px] text-primary-fixed-dim">inspect("https://target-site.com")</code>
<div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter2\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'1.5\' numOctaves=\'2\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter2)\' opacity=\'1\'/%3E%3C/svg%3E');"></div>
</div>
<!-- Mini Preview Area -->
<div class="bg-surface rounded border border-outline-variant h-48 relative overflow-hidden p-4 flex flex-col gap-3 shadow-inner">
<!-- Mock Content -->
<div class="w-3/4 h-4 bg-surface-dim rounded"></div>
<div class="w-full h-2 bg-surface-container-high rounded"></div>
<div class="w-5/6 h-2 bg-surface-container-high rounded"></div>
<!-- Highlighted "Target" -->
<div class="mt-2 border-2 border-[#ef4444] bg-[#ef4444]/10 rounded p-2 relative animate-pulse shadow-[0_0_10px_rgba(239,68,68,0.2)]">
<div class="w-1/2 h-3 bg-surface-dim rounded mb-2"></div>
<div class="w-full h-2 bg-surface-container-high rounded"></div>
<!-- Picker Crosshair indicator -->
<div class="absolute -top-2 -right-2 w-4 h-4 text-[#ef4444] flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] font-bold">target</span>
</div>
</div>
<div class="w-full h-2 bg-surface-container-high rounded mt-2"></div>
</div>
</div>
</div>
</div>
<!-- Footer -->
<footer class="bg-surface-container-lowest border-t border-outline-variant h-10 flex justify-between items-center px-panel-padding w-full relative z-20">
<div class="font-terminal-code text-label-caps text-secondary w-full text-center tracking-[0.1em] opacity-80">
                VISUAL EXTRACTION // BEAUTIFULSOUP // STATIC SITES // V.1.0.4
            </div>
</footer>
</main>
</body></html>
